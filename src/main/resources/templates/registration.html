<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration</title>
</head>
<body>

<h2> Registration </h2>

<form th:action ="@{/registration}" th:object="${user}" method="post">

    <label>Login:</label><br>
    <input type="text" th:field="*{username}" required><br>
    <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span><br>
    <label>Pass:</label><br>
    <input type="password" th:field="*{password}" required><br>
    <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span><br>
    <button type="submit">Add</button>

</form>

</body>
</html>
